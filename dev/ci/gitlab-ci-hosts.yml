# ==========================================================================
# Host-Specific Configurations for the global-workflow CI Pipeline
# ==========================================================================
#
# This file defines host-specific job configurations for different computing
# platforms supported by the global-workflow testing pipeline. It's designed
# to be easily extendable with new computing platforms.
#
# Key features:
# - Per-host jobs that dynamically resolve and run the PR case matrix
# - Includes two sections supporting the standard PR Cases and CTests
# - Host-specific tags and variables for job routing to the correct runners
# - Conditional rules based on trigger type (PR vs trigger)
#
# The CI_PIPELINE_SOURCE variable (set by GitLab) is when the pipeline is triggered
# by a GitHub action. This is used to determine whether to run CTests (trigger) or
# standard cases (!trigger).
#
# IMPORTANT: which PR cases run on which host is *not* listed anywhere in this
# file. Each host's "generate_cases-<host>" job runs
# dev/ci/scripts/utils/generate_case_pipeline.py on that host, which shells
# out to `dev/workflow/generate_workflows.sh -L` to resolve the current,
# host-filtered case list (based solely on each case YAML's `skip_ci_on_hosts`
# key) and emits it as a small GitLab child pipeline. The "run_cases-<host>"
# job then triggers that generated child pipeline to actually set up and run
# the resolved cases. Adding or removing a case from a host only ever
# requires editing that case's YAML under dev/ci/cases/pr/.

# =======================================
# Standard Cases configurations by host
# =======================================

# Template for the job that resolves this host's supported PR case list
# (via generate_workflows.sh -L) and emits it as a child pipeline.
.generate_case_pipeline_template:
  extends: .base_config
  stage: generate_matrix
  script:
    - |
      source "${GW_HOMEgfs}/dev/ush/gw_setup.sh"
      python3 "${GW_HOMEgfs}/dev/ci/scripts/utils/generate_case_pipeline.py" \
        --host "${machine}" \
        --homeglobal "${GW_HOMEgfs}" \
        --output "case-pipeline-${machine}.yml"
      cat "case-pipeline-${machine}.yml"
  artifacts:
    paths:
      - case-pipeline-${machine}.yml

# Host: Hera - Generate and run PR Cases
generate_cases-hera:
  extends: .generate_case_pipeline_template
  variables:
    machine: hera
  tags:
    - hera
  needs:
    - build-hera
  rules:
    - if: $PIPELINE_TYPE == "pr_cases" && ($CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "schedule") && ($RUN_ON_MACHINES =~ /\bhera\b|all/)

run_cases-hera:
  stage: setup_tests
  needs:
    - generate_cases-hera
  variables:
    # Explicitly forward the parent pipeline context to the generated child
    # pipeline (same-project child pipelines inherit predefined CI/CD
    # variables, but forwarding these explicitly keeps behavior consistent
    # regardless of GitLab version/config).
    PIPELINE_TYPE: ${PIPELINE_TYPE}
    RUN_ON_MACHINES: ${RUN_ON_MACHINES}
    GFS_CI_RUN_TYPE: ${GFS_CI_RUN_TYPE}
    PR_NUMBER: ${PR_NUMBER}
    GITHUB_COMMIT_SHA: ${GITHUB_COMMIT_SHA}
    GW_REPO_URL: ${GW_REPO_URL}
    WORKSPACE_ID: ${WORKSPACE_ID}
    GIT_CLONE_PATH: ${GIT_CLONE_PATH}
  trigger:
    include:
      - artifact: case-pipeline-hera.yml
        job: generate_cases-hera
    strategy: depend
  rules:
    - if: $PIPELINE_TYPE == "pr_cases" && ($CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "schedule") && ($RUN_ON_MACHINES =~ /\bhera\b|all/)

