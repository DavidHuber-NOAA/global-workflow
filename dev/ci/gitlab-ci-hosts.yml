# =======================================
# CTests configurations by host
# =======================================

# Template for CTest jobs that will be used across machines
.ctests_cases_template:
  extends: .run_ctests_template
  stage: run_tests
  parallel:
    matrix:
      - CTEST_NAME:
        # C48_ATM CTests
        - C48_ATM-gfs_stage_ic
        - C48_ATM-gfs_fcst_seg0
        - C48_ATM-gfs_atmos_prod_f000-f002
        - C48_ATM-gfs_tracker
        - C48_ATM-gfs_genesis
        # C48_S2SW CTests
        - C48_S2SW-gfs_fcst_seg0
        - C48_S2SW-gfs_ocean_prod_f006
        - C48_S2SW-gfs_ice_prod_f006
        # C48_S2SWA_gefs CTests
        - C48_S2SWA_gefs-gefs_fcst_mem001_seg0

# Host-specific CTest setup jobs
