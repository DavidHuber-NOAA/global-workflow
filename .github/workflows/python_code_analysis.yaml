name: python_code_analysis
on:
  push:
    branches:
      - develop
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_norms:
    runs-on: ubuntu-22.04
    name: Check Python coding norms with pycodestyle

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install pycodestyle
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle

      - name: Run pycodestyle and collect findings
        id: pycodestyle
        run: |
          set -uo pipefail
          outdir="${RUNNER_TEMP}/pycodestyle"
          mkdir -p "${outdir}"

          # Capture machine-readable findings (no -v, so only results are
          # recorded). pycodestyle exits non-zero when it finds issues.
          pycodestyle --config ./.pycodestyle ./ > "${outdir}/pycodestyle.txt"
          status=$?

          # PR number for the reporting workflow.
          printf '%s' "${PR_NUMBER}" > "${outdir}/pr-number"

          echo '::group:: pycodestyle findings'
          cat "${outdir}/pycodestyle.txt" || true
          echo '::endgroup::'

          exit "${status}"

      - name: Upload pycodestyle diagnostics
        # Upload even when the previous step failed (that is exactly when there
        # are findings to report). Only pull requests need the reporting job.
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-code-analysis-pycodestyle
          path: ${{ runner.temp }}/pycodestyle
          retention-days: 1
          if-no-files-found: warn
