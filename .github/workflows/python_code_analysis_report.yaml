name: python_code_analysis_report

# Trusted companion to `python_code_analysis.yaml`.
#
# The analysis workflow runs on `pull_request`; for pull requests from forks it
# gets a read-only token and cannot comment. This workflow is triggered by
# `workflow_run`, so it runs from the base repository's default branch with a
# read/write token and posts the pycodestyle findings as a sticky PR comment.
#
# Security notes:
# - This workflow never checks out or executes the pull request's code. It only
#   downloads the diagnostics artifact and renders it to Markdown.
# - The artifact is produced by an untrusted run, so the PR number is strictly
#   validated before use.
on:
  workflow_run:
    workflows: ["python_code_analysis"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    # Only act on runs triggered by a pull request; skip push / workflow_dispatch.
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-22.04

    steps:
      # Check out the base repository's default branch (trusted code) so we can
      # use the summary script. This never checks out the pull request's head.
      - name: Checkout base repo
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Download diagnostics from the analysis run
        uses: actions/download-artifact@v4
        with:
          name: python-code-analysis-pycodestyle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pycodestyle-artifacts

      - name: Post pycodestyle summary as a PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          d=pycodestyle-artifacts

          # PR number comes from the untrusted artifact: validate strictly.
          pr_number="$(cat "${d}/pr-number")"
          [[ "${pr_number}" =~ ^[0-9]+$ ]] || { echo "Invalid PR number: '${pr_number}'"; exit 1; }

          # Build the Markdown comment body from the collected diagnostics.
          python3 .github/scripts/python_analysis_summary.py "${d}" "${RUNNER_TEMP}/comment.md"

          # Post (or update) a single "sticky" comment identified by a marker,
          # so repeated runs update in place instead of spamming the PR.
          marker='<!-- python-code-analysis-summary -->'
          existing="$(gh api --paginate "repos/${OWNER}/${REPO}/issues/${pr_number}/comments" \
            --jq "[.[] | select(.body | contains(\"${marker}\")) | .id] | first // empty")"
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${OWNER}/${REPO}/issues/comments/${existing}" \
              -F body=@"${RUNNER_TEMP}/comment.md" >/dev/null
            echo "Updated existing comment ${existing}."
          else
            gh api -X POST "repos/${OWNER}/${REPO}/issues/${pr_number}/comments" \
              -F body=@"${RUNNER_TEMP}/comment.md" >/dev/null
            echo "Created a new summary comment."
          fi
