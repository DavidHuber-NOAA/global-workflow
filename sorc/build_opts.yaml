# Shared build options. Systems are discovered from build_systems/<system>.yaml; each file lists
# the components of that system and defines the build entries only that system uses.
# Components used by more than one system (or by all of them) are defined here.
default_system: gfs  # used when no system is given (falls back to the first system found)
host_override:  # over-ride options for host
  # Gaea must use the login nodes for builds
  GAEAC6:
    max_cores: 8
    walltime_ratio: 2  # Uniformly adjust the wallclock by this factor (builds are slower on head nodes)
#    exclude_nodes: "gaea61"  # Use this field to black-list out any malfunctioning nodes.
    build:
      gdas:
        cores: 8
        memory: "60G"
        walltime: "03:00:00"
systems:
  common:  # always built, whatever systems are requested
    - "ufs_utils"
    - "gfs_utils"
    - "upp"
build:
  upp:
    command: "./build_upp.sh"
    cores: 8
    walltime: "00:15:00"
    requires: [ufs_model.fd]

  ufs_utils:
    command: "./build_ufs_utils.sh"
    cores: 8
    walltime: "00:15:00"
    requires: [ufs_utils.fd]

  gfs_utils:
    command: "./build_gfs_utils.sh"
    cores: 6
    walltime: "00:15:00"
    requires: [gfs_utils.fd]

  gsi_utils:
    command: "./build_gsi_utils.sh"
    cores: 6
    walltime: "00:15:00"
    requires: [gsi_utils.fd]

  gsi_monitor:
    command: "./build_gsi_monitor.sh"
    cores: 4
    walltime: "00:15:00"
    requires: [gsi_monitor.fd]

  nexus:
    command: "./build_nexus.sh"
    cores: 8
    walltime: "00:20:00"
    requires: [nexus.fd]

  gefs_ww3_prepost:
    command: "./build_ww3prepost.sh -w"
    cores: 4
    walltime: "00:15:00"

